      teamsBook: () => this.setState(nrw ? { mBook: true } : { chStep: 7, chManual: true }),
      waApprove: () => this.setState(nrw ? { waPick: 'Approve', mWa: true } : { chStep: 3, waPick: 'Approve', chManual: true, tapAt: Math.min(st.chStep, 2) }),
      waReject: () => this.setState(nrw ? { waPick: 'Reject', mWa: true } : { chStep: 3, waPick: 'Reject', chManual: true, tapAt: Math.min(st.chStep, 2) }),
      waChoice: st.waPick,
      waDone: st.waPick === 'Reject' ? 'Rejected. I\'ve let the Marketing team know and put the invoice on hold.' : 'Thanks, Kelly. Approved and sent to Finance for final sign-off.',
      w1: !nrw && st.chStep >= 1 && (st.tapAt === undefined || st.tapAt >= 1), w2: !nrw && st.chStep >= 2 && (st.tapAt === undefined || st.tapAt >= 2), w3: nrw ? !!st.mWa : st.chStep >= 3, w4: nrw ? !!st.mWa : st.chStep >= 4,
      flowSteps: ['Invoice received', 'Read details', '3-way match', 'Fraud check', 'Department head', 'Finance', 'Post to ERP'].map((l, i) => {
        const cur = Math.min(st.ag, 7);
        const done = i < cur; const now = i === cur;
        return { label: l, done: done, notFirst: i > 0, first: i === 0 ? 'first' : '',
          lineCls: i <= cur ? 'done' : '', dotCls: done ? 'done' : (now ? 'now' : ''), stepCls: now ? 'now' : '',
          waiting: now && (i === 4 || i === 5) };
      })
    };
  }
}
ClarkPage.mount(Component);
</script>
